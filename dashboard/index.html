<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Studio</title>
<style>
:root{
  --bg:#f7f1e6; --panel:#fffdf8; --ink:#1d1a17; --muted:#6f665c; --line:#e5dccd;
  --red:#b22e26; --mint:#33f2c7; --purple:#8c2ef2; --ok:#1f8a5b; --warn:#b7791f;
  --label:#2f6fdb; --place:#c2410c; --emoji:#a16207; --broll:#7c3aed; --stock:#0f766e;
  --lib:#be185d; --auto:#9d174d; --hand:#1d1a17; --news:#dc2626; --card:#0e7490; --article:#4d7c0f; --year:#4338ca;
  --r:14px; --shadow:0 1px 2px rgba(40,30,20,.06),0 4px 16px rgba(40,30,20,.06);
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Avenir Next","Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;background:#f3ebdd}
.brand{display:flex;align-items:baseline;gap:8px;margin:0 6px 18px}
.brand b{font:800 22px/1 "Avenir Next",sans-serif;color:var(--red);letter-spacing:-.3px}
.brand span{color:var(--muted);font-size:13px}
.proj{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.proj:hover{background:#ebe1d0} .proj.on{background:var(--ink);color:#fff}
.proj small{display:block;opacity:.65;font-size:12px}
.new{display:flex;flex-wrap:wrap;gap:6px;margin:14px 4px 0}
.new select{order:3;flex-basis:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 6px}
.new input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px}
main{padding:26px 32px 80px;max-width:1180px}
h1{font:800 28px/1.1 "Avenir Next",sans-serif;margin:0;letter-spacing:-.4px}
h2{font:700 13px/1 "Avenir Next",sans-serif;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:30px 0 12px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;background:#ece3d3}
.pill.running,.pill.stale{background:#fdf0d5;color:var(--warn)} .pill.done{background:#dcf3e8;color:var(--ok)}
.pill.failed,.pill.err{background:#fbe0dd;color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.running .dot{animation:pulse 1s infinite} @keyframes pulse{50%{opacity:.25}}
.btn{border:0;border-radius:10px;padding:9px 15px;font-weight:650;cursor:pointer;background:#ece3d3}
.btn:hover{filter:brightness(.96)} .btn.primary{background:var(--red);color:#fff} .btn.dark{background:var(--ink);color:#fff}
.btn.small{padding:5px 10px;font-size:13px} .btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.drop{border:2px dashed #d4c7b2;border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);transition:.15s;background:#fffaf1}
.drop.over{border-color:var(--red);background:#fff1ea;color:var(--red)}
.drop b{color:var(--ink)}
.files{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.files img{height:74px;border-radius:8px;border:1px solid var(--line)}
.tray{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tray .th{flex:0 0 auto;width:64px;height:64px;border-radius:9px;background:#ece3d3 center/cover;border:1px solid var(--line);cursor:grab;display:flex;align-items:flex-end;font-size:10px;overflow:hidden}
.tray .th span{background:rgba(0,0,0,.55);color:#fff;width:100%;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lines{max-height:340px;overflow:auto;margin-top:10px;border-top:1px solid var(--line)}
.ln{display:flex;gap:10px;align-items:baseline;padding:7px 6px;border-bottom:1px solid var(--line);font-size:14px;border-radius:6px}
.ln .tm{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 38px}
.ln .tx{flex:1}
.ln.over{background:#fff1ea;outline:2px dashed var(--red)}
.ln .hb{font-size:12px;background:var(--ink,#222);color:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap}
.ln .hb b{cursor:pointer;margin-left:5px;opacity:.7}
.chipv{font-size:13px;background:#ece3d3;border-radius:8px;padding:6px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.f{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:5px}
.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px}
.in:focus{outline:2px solid var(--mint);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--red);color:var(--red)}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sty{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:#fff;text-align:center}
.sty.on{border-color:var(--red)}
.sty .demo{height:62px;border-radius:8px;background:linear-gradient(#cfc6b8,#9d948a);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.d-btb{font:900 19px "Avenir Next";color:#fff;text-shadow:2px 3px 0 #000;letter-spacing:.5px}
.d-btb i{font-style:normal;background:var(--purple);color:var(--mint);padding:0 4px;border-radius:4px}
.d-box{background:#fff;color:#111;border-radius:9px;padding:3px 9px;font:500 14px Helvetica}
.d-mono{background:#0a0a0a;color:#fff;border-radius:5px;padding:3px 9px;font:700 13px Menlo,monospace;letter-spacing:1.5px}
.sty small{font-size:12px;color:var(--muted)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.vid{display:flex;flex-direction:column;gap:12px}
.vid.wide{grid-column:1/-1}
.wbtn{white-space:nowrap;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;cursor:pointer}
.vid.off{opacity:.55}
.vhead{display:flex;align-items:center;gap:8px}
.vhead input{flex:1;font-weight:700;border:1px solid transparent;background:none;border-radius:8px;padding:4px 6px;margin-left:-6px}
.vhead input:hover,.vhead input:focus{border-color:var(--line);background:#fff}
.player{display:flex;gap:12px}
video{width:150px;aspect-ratio:9/16;border-radius:10px;background:#1d1a17;object-fit:cover;flex:none}
.ph{width:150px;aspect-ratio:9/16;border-radius:10px;background:#ece3d3;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:10px;flex:none}
.meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;min-width:0}
.meta a{color:var(--ink);font-weight:600}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.postp{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.postp textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:14px;line-height:1.45;resize:vertical;box-sizing:border-box}
.postp input.tags{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;box-sizing:border-box;font-size:13px}
.postp .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.postp .cov{width:84px;border-radius:8px;border:1px solid var(--line)}
.postp .flag{font-size:12.5px;background:#fff1ea;color:var(--red);border-radius:7px;padding:5px 8px}
.postp .alt{font-size:12.5px;color:var(--muted)}
.tlwrap{overflow-x:auto;border-radius:7px}
.timeline{position:relative;min-width:100%;background:#f1e9db;border-radius:7px;overflow:hidden;touch-action:none;user-select:none;
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--px5) - 1px),#e2d6c2 calc(var(--px5) - 1px) var(--px5))}
.tl{position:absolute;height:28px;border-radius:5px;min-width:8px;opacity:.92;cursor:grab;font-size:10px;color:#fff;line-height:32px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl.moved{box-shadow:inset 0 0 0 2px #fff}
.tl.drag{cursor:grabbing;opacity:1;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tl .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(255,255,255,.35)}
.tl .h.l{left:0}.tl .h.r{right:0}
.tl.pending{opacity:.6;background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.35) 6px 12px)!important;outline:1px dashed #0006}
.timeline.over{outline:2px dashed var(--red);outline-offset:-2px}
.tltray{margin-bottom:6px}
.tray .th.mine{border:2px solid var(--red)}
.tight{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tight .tb{flex:1 1 160px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:#fffaf1;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tight .tb.on{border:2px solid var(--red);background:#fff1ea}
.tight .tb small{color:var(--muted);font-size:12px}.tight .tb i{font-style:normal;font-size:12px;color:var(--red)}
.tlbar{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:3px 2px 6px}
.tlbar a{color:var(--red);cursor:pointer}
.tltip{position:fixed;pointer-events:none;background:#222;color:#fff;font-size:12px;padding:3px 7px;border-radius:6px;z-index:9;display:none}
.tl.off{opacity:.22}
.plan{max-height:220px;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
.it{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.it .k{width:9px;height:9px;border-radius:3px;flex:none}
.it .t{color:var(--muted);font-variant-numeric:tabular-nums;width:40px;flex:none}
.it .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.off .w{text-decoration:line-through;color:var(--muted)}
.it .lnk{flex:0 1 auto;max-width:34%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted);text-decoration:none}.it .lnk:hover{color:var(--ink)}
.sw{position:relative;width:32px;height:18px;flex:none;cursor:pointer}
.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;margin:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:#d6ccbc;transition:.15s;pointer-events:none}
.sw span:after{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+span{background:var(--ok)} .sw input:checked+span:after{left:16px}
.post{display:flex;gap:6px;flex-wrap:wrap}
.pb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:12.5px;cursor:pointer}
.pb.done{background:#dcf3e8;border-color:#bfe6d3;color:var(--ok);font-weight:650}
.note{width:100%;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;background:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.look img{width:100%;border-radius:10px;display:block;background:#1d1a17}
.lookbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.muted{color:var(--muted);font-size:13.5px}
.pill.preview{background:#ece0fb;color:var(--purple)}
pre.log{background:#1d1a17;color:#e9e3d8;border-radius:12px;padding:12px 14px;font:12px/1.5 Menlo,monospace;white-space:pre-wrap;max-height:200px;overflow:auto;margin:0}
.empty{color:var(--muted);text-align:center;padding:60px 20px}
.steps{display:flex;gap:6px;margin:16px 0 4px;flex-wrap:wrap}
.step{flex:1;min-width:120px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left}
.step b{display:block;font-size:13.5px} .step small{color:var(--muted);font-size:12px}
.step.done{border-color:#bfe6d3;background:#effaf4} .step.done b:before{content:"✓ ";color:var(--ok)}
.step.now{border-color:var(--red);box-shadow:0 0 0 2px #f6d5d2}
h2.sec{cursor:pointer;display:flex;gap:8px;align-items:baseline;user-select:none}
h2.sec:before{content:"▾";font-size:11px} h2.sec.collapsed:before{content:"▸"}
h2.sec small{text-transform:none;letter-spacing:0;font-weight:500;font-size:12.5px}
h2.sec.collapsed + *{display:none}
.phl{position:absolute;top:0;bottom:0;width:2px;background:var(--red);pointer-events:none;z-index:3;display:none}
.nav{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between}
.nav button:hover{background:#ebe1d0} .nav button.on{background:var(--ink);color:#fff}
.nav small{opacity:.6;font-weight:500}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.ins{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.ins .media{aspect-ratio:4/5;background:#1d1a17 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;text-align:center;padding:10px;position:relative}
.ins .media video{width:100%;height:100%;object-fit:cover;border-radius:0;aspect-ratio:auto}
.ins .media a{color:#fff}
.ins .body{padding:10px 12px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.ins .ask{background:#fff8e6;border:1px solid #f1dfb0;border-radius:9px;padding:8px}
.likes{display:flex;flex-wrap:wrap;gap:5px}
.likes label{border:1px solid var(--line);border-radius:99px;padding:3px 9px;cursor:pointer;background:#fff;font-size:12px}
.likes input{display:none} .likes input:checked+span{color:var(--red);font-weight:700}
.likes label:has(input:checked){border-color:var(--red);background:#fff1ea}
.ins textarea,.ins select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:13px;background:#fff}
.ins .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);border:0;color:#fff;border-radius:7px;padding:2px 7px;cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.lf{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lf .m{aspect-ratio:1;background:#ece3d3 center/cover;display:flex;align-items:center;justify-content:center;font-size:28px}
.lf input{width:100%;border:0;border-top:1px solid var(--line);padding:6px 8px;font-size:12px;background:#fff}
.lf .row{display:flex;justify-content:space-between;padding:4px 8px;font-size:11px;color:var(--muted)}
.lf .row a{color:var(--red);cursor:pointer}
.hc{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.hc .ic{font-size:18px;width:24px;text-align:center}
.hc b{display:block} .hc small{color:var(--muted)}
.err{color:var(--red);font-size:13px}
@media (max-width:820px){.app{grid-template-columns:1fr} aside{position:static;height:auto} main{padding:18px 16px 60px} .grid2,.styles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>Reel Studio</b><span>Another Party</span></div>
    <div id="plist"></div>
    <div class="nav">
      <button data-view="inspiration">✨ Inspiration <small id="nInsp"></small></button>
      <button data-view="library">🎞 B-roll library <small id="nLib"></small></button>
      <button data-view="health">🩺 Health check <small id="nHealth"></small></button>
    </div>
    <form class="new" id="newf"><input id="newname" placeholder="New project name"><select id="newtype" title="Project type"></select><button class="btn small dark">Add</button></form>
  </aside>
  <main id="main"><div class="empty">Pick a project on the left, or start a new one.</div></main>
</div>
<script>
const COLORS={label:'var(--label)',place:'var(--place)',emoji:'var(--emoji)',broll:'var(--broll)',stock:'var(--stock)',
  lib:'var(--lib)',auto:'var(--auto)',hand:'var(--hand)',news:'var(--news)',card:'var(--card)',article:'var(--article)',year:'var(--year)'};
const KINDS={label:'Name label',place:'Place card',emoji:'Emoji',broll:'Screenshot',stock:'Stock footage',lib:'Your library',auto:'Your B-roll, placed by Claude',hand:'Placed by you',news:'News bar',card:'Quote / stat card',article:'Article card',year:'Year strip'};
const $=s=>document.querySelector(s);
let cur=null, data=null, timer=null, editing=false, LASTSIG='', LASTVID=null;
// spacebar plays / pauses the video you last played (unless you're typing)
document.addEventListener('keydown',e=>{if(e.code!=='Space'||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const v=LASTVID&&document.body.contains(LASTVID)?LASTVID:document.querySelector('video[data-v]'); if(!v)return;
  e.preventDefault(); v.paused?v.play():v.pause()});
const api=(p,o={})=>fetch(p,{headers:{'Content-Type':'application/json'},...o}).then(r=>r.json());
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kind=it=>{const p=String(it.id||'').split(':')[0];
  return {stock:'stock',lib:'lib',auto:'auto',hand:'hand',pending:'hand',quote:'card',stat:'card',news:'news',article:'article'}[p]||(it.type==='broll'?'broll':it.type)};
const fmt=t=>{t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};

async function loadList(){
  api('/api/inspiration').then(r=>$('#nInsp').textContent=r.items.length||'');
  const ps=await api('/api/projects');
  $('#plist').innerHTML=ps.map(p=>`<button class="proj ${p.id===cur?'on':''}" data-id="${p.id}">${esc(p.name)}
    <small>${p.state==='running'?'● rendering':p.videos+' video'+(p.videos===1?'':'s')}</small></button>`).join('')||'<div class="chipv">No projects yet</div>';
  document.querySelectorAll('.proj').forEach(b=>b.onclick=()=>open(b.dataset.id));
  if(!cur&&ps.length) open(ps[0].id);
}
fetch('/api/presets').then(r=>r.json()).then(ps=>{$('#newtype').innerHTML=ps.map(p=>`<option value="${p.id}" title="${esc(p.blurb)}">${esc(p.name)}</option>`).join('')});
$('#newf').onsubmit=async e=>{e.preventDefault();const n=$('#newname').value.trim();if(!n)return;
  const r=await post('/api/projects',{name:n,preset:$('#newtype').value});$('#newname').value='';cur=r.id;await loadList();open(r.id)};

async function open(id){cur=id;VIEW='project';LASTSIG='';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));try{localStorage.setItem('reelstudio.cur',id)}catch(e){}
  document.querySelectorAll('.proj').forEach(b=>b.classList.toggle('on',b.dataset.id===id));await refresh(true)}

async function refresh(full){
  if(!cur||VIEW!=='project')return; data=await api('/api/p/'+cur);
  if(!data||data.error){cur=null;try{localStorage.removeItem('reelstudio.cur')}catch(e){}$('#main').innerHTML='<p class="muted">Pick a project on the left.</p>';return}
  const sig=JSON.stringify(data), playing=[...document.querySelectorAll('video')].some(v=>!v.paused);
  if(full||(!editing&&!playing&&sig!==LASTSIG)) render();
  LASTSIG=sig;
  clearTimeout(timer); timer=setTimeout(()=>refresh(false), data.running?2500:8000);
}

function render(){
  const d=data,c=d.cfg,st=d.status||{};
  const ss=st.state||'idle', stale=(d.outputs||[]).some(o=>o.on&&(o.prev||ss==='done'&&!o.url));   // a setting change sent a video (or the look preview) back for re-render
  const state=d.running?'running':/^(done|preview)/.test(ss)&&stale?'stale':ss;
  const pill=`<span class="pill ${state.startsWith('done')?'done':state.startsWith('preview')?'preview':state}"><span class="dot"></span>${
    d.running?`${esc(st.job||'')} ${esc(st.step||'working')}`:state==='done'?'All videos ready':state==='stale'?'Needs a re-render':esc(state)}</span>`;
  const shots=(c.shots||[]).map(s=>`<img src="/files/${d.id}/${encodeURI(s)}" title="${esc(s)}">`).join('');
  const sug=(d.suggestions||[]).map(s=>`<button class="chip" data-sug="${esc(s)}">${esc(s)}</button>`).join('');
  $('#main').innerHTML=`

const SEC={}; try{Object.assign(SEC,JSON.parse(localStorage.getItem('reelstudio.sec')||'{}'))}catch(e){}
function sec(key,title,summary,collapsedByDefault){
  const col=key in SEC?SEC[key]:collapsedByDefault;

function stepBar(d){
  const c=d.cfg, outs=(d.outputs||[]).filter(o=>o.on), made=outs.filter(o=>o.url).length,
        posted=outs.filter(o=>Object.entries(o.posting||{}).some(([k,v])=>k!=='note'&&v)).length;
  const steps=[['footage','Footage',!!c.video,c.video?'Video in':'Drop the video'],
    ['check','Look',!!c.look_ok,c.look_ok?'Approved':d.look?'Waiting for your OK':'Preview first'],
    ['videos','Videos',outs.length>0&&made===outs.length,`${made} of ${outs.length} made`],
    ['post','Post',outs.length>0&&posted===outs.length,`${posted} of ${outs.length} posted`]];
  const now=steps.findIndex(s=>!s[2]);
  return `<div class="steps">${steps.map(([k,n,done,sub],i)=>`<button class="step ${done?'done':''} ${i===now?'now':''}" data-jump="${k==='post'?'videos':k}"><b>${n}</b><small>${sub}</small></button>`).join('')}</div>`}
// transcript time <-> video time, through the dead-air cuts ("a-b,c-d" in transcript seconds)
const ranges=c=>(c||'').split(',').filter(Boolean).map(r=>r.split('-').map(Number));
function src2out(s,c){let o=0;for(const [a,b] of ranges(c)){if(s<a)return o;if(s<=b)return o+s-a;o+=b-a}return o}
function out2src(t,c){let o=0;for(const [a,b] of ranges(c)){if(t<=o+(b-a))return a+(t-o);o+=b-a}return null}
function vidCard(o){
  const w0=o.window?o.window.split('-').map(Number):null;
  // B-roll you dropped that this video's plan doesn't have yet: a dashed "pending" block until the next render
  const pend=(data.cfg.manual_broll||[]).filter(m=>(!w0||(m.start>=w0[0]&&m.start<=w0[1]))&&
      !(o.plan||[]).some(i=>String(i.id).startsWith('hand:')&&Math.abs(i.src[0]-m.start)<0.05))
    .map(m=>({id:'pending:'+m.path, type:'broll', image:m.path, src:[m.start,m.end], on:true, pending:true,
      why:`you dropped ${m.path.split('/').pop()} here; it shows up after the next render`}));
  const plan=[...(o.plan||[]),...pend], end=Math.max(1,...plan.map(i=>i.src[1]),
    o.window?parseFloat(o.window.split('-')[1]):1), start=o.window?parseFloat(o.window.split('-')[0]):0;
  const span=Math.max(1,end-start);
  const lanes=[], lane=[];     // overlapping blocks go on separate rows so every block can be grabbed
  [...plan.keys()].sort((x,y)=>plan[x].src[0]-plan[y].src[0]).forEach(n=>{const i=plan[n];
    let k=lanes.findIndex(e=>e<=i.src[0]);if(k<0){k=lanes.length;lanes.push(0)}lanes[k]=i.src[1];lane[n]=k});
  const PX=28, tlW=Math.round(span*PX), tlH=Math.max(1,lanes.length)*32+6;
  const tl=plan.map((i,n)=>`<div class="tl ${i.on?'':'off'} ${i.moved?'moved':''} ${i.pending?'pending':''}" data-id="${esc(i.id)}" data-s="${i.src[0]}" data-e="${i.src[1]}" title="${esc(i.why)}" style="top:${4+lane[n]*32}px;left:${(i.src[0]-start)/span*100}%;width:${(i.src[1]-i.src[0])/span*100}%;background:${COLORS[kind(i)]}"><i class="h l"></i>${esc(label(i))}<i class="h r"></i></div>`).join('');
  const items=plan.filter(i=>!i.pending).map(i=>`<div class="it ${i.on?'':'off'}"><i class="k" style="background:${COLORS[kind(i)]}"></i>
    <span class="t">${fmt(i.src[0]-start)}</span><span class="w" title="${esc(i.why)}">${esc(label(i))}</span>${/^https?:\/\//.test(i.url||'')?`<a class="lnk" href="${esc(i.url)}" target="_blank" rel="noopener" title="${esc(i.url)}">${esc(i.outlet||'article')} ↗</a>`:''}
    <label class="sw"><input type="checkbox" data-tog="${esc(i.id)}" data-v="${o.name}" ${i.on?'checked':''}><span></span></label></div>`).join('');
  const P=o.posting||{};
  const plat=[['instagram','Instagram'],['facebook','Facebook'],['youtube','YouTube']].map(([k,n])=>
    `<button class="pb ${P[k]?'done':''}" data-post="${k}" data-v="${o.name}">${P[k]?'✓ ':''}${n}${P[k]?' · '+esc(P[k]):''}</button>`).join('');
  const src=o.phone||o.url||o.prev;
  return `<div class="card vid ${o.on?'':'off'} ${isWide(o)?'wide':''}">
    <div class="vhead">${plan.length?`<button class="wbtn" data-wide="${o.name}" title="Stretch this card across the page to edit its timeline">${isWide(o)?'Narrow':'⤢ Wide'}</button>`:''}${o.name==='full'?`<b style="flex:1">Full video</b>`:`<input value="${esc(o.tag)}" data-tag="${o.name}" title="Title tag for this reel">
      <label class="sw" title="Make this reel"><input type="checkbox" data-reel="${o.name}" ${o.on?'checked':''}><span></span></label>`}</div>
    <div class="player">${src?`<video src="${src}#t=0.5" data-v="${o.name}" controls preload="metadata" playsinline></video>`:`<div class="ph">${o.on?'Not rendered yet':'Switched off'}</div>`}
      <div class="meta">${!o.url&&o.prev?`<span class="pill" style="align-self:flex-start">Showing the previous version</span>`:''}${o.window?`<span>From ${fmt(start)} to ${fmt(end)}</span>`:''}
        ${o.url?`<a href="${o.url}?dl=1">Download full quality</a><span>${o.mb} MB · for Instagram upload</span>`:''}
        ${o.phone?`<a href="${o.phone}?dl=1">Download phone copy</a><span>${o.phone_mb} MB · for texting / review</span>`:''}
        <span>${plan.filter(i=>i.on).length} graphics planned</span></div></div>
    ${plan.length&&isWide(o)?`<div class="tray tltray" title="Drag a photo or clip onto the timeline below (or drop a file from Finder)"></div>`:''}
    ${plan.length?`<div class="tlwrap"><div class="timeline" data-v="${o.name}" data-start="${start}" data-span="${span}" data-cuts="${esc(o.cuts||'')}" style="width:${tlW}px;height:${tlH}px;--px5:${PX*5}px">${tl}<i class="phl"></i></div></div>
      <div class="tlbar"><span>${fmt(0)}</span><span>Drag a block to move it · drag its edge to stretch it${isWide(o)?' · drop B-roll onto it':''}${plan.some(i=>i.moved)?` · <a data-reset="${o.name}">Reset moves</a>`:''}</span><span>${fmt(span)}</span></div>
      <div class="plan">${items}</div>`:''}
    ${o.url?postPanel(o):''}
    <div><label class="f">Posted</label><div class="post">${plat}</div>
      <input class="note" style="margin-top:6px" placeholder="Waiting on… (e.g. Craig's OK)" data-note="${o.name}" value="${esc(P.note||'')}"></div>
  </div>`;
}

function label(i){
  const k=kind(i), skip=/\(skipped/.test(i.why||'')?' (overlaps something, off)':'';
  if(k==='news')return `📰 ${i.headline||''}${skip}`;
  if(k==='card')return i.quote&&i.quote.num?`🔢 ${i.quote.num} ${i.quote.label||''}${skip}`:`❝ ${(i.quote||{}).text||''}${skip}`;
  if(k==='lib')return `🎞 ${(i.image||i.video||'').split('/').pop()}${skip}`;
  if(k==='auto')return `🖼 ${(i.image||i.video||'').split('/').pop()}${skip}`;
  if(k==='hand')return `✋ ${(i.image||i.video||'').split('/').pop()}`;
  if(k==='article')return `🗞 ${i.outlet||''}: ${(i.why||'').replace(/^[^:]*:\s*/,'').replace(/\s*\(https?:[^)]*\).*$/,'')}${skip}`;
  if(k==='stock')return `🎥 stock: ${String(i.id).slice(6)}${skip}`;
  if(i.type==='label')return `${i.name} · ${i.role}`;
  if(i.type==='place')return `📍 ${i.place} ${i.year||''}`;
  if(i.type==='year')return `📅 ${i.y0} → ${i.y1}${skip}`;
  if(i.type==='emoji')return `${i.emoji} at ${i.why}`;
  return i.why;
}

    const r=await post(`/api/p/${cur}/caption`,{video:n}); if(r.error){s.textContent=r.error;b.disabled=false}else refresh(true)});
  document.querySelectorAll('[data-pf]').forEach(el=>{el.onfocus=()=>editing=true;
    el.onblur=async()=>{editing=false;await post(`/api/p/${cur}/post_save`,{video:el.dataset.pv,[el.dataset.pf]:el.value})}});
  document.querySelectorAll('[data-cover]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Making cover…';
    const r=await post(`/api/p/${cur}/cover`,{video:b.dataset.cover,step:+b.dataset.step});if(r.error)alert(r.error);refresh(true)});
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const box=b.closest('.postp');
    const cap=(box.querySelector('[data-pf=caption]')||{}).value||'', tags=box.querySelector('[data-pf=tags]').value;
    const txt=(cap+'\n\n'+tags).trim(); let ok=false;
    try{ok=(await post('/api/clip',{text:txt})).ok}catch(e){}
    if(!ok){try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}}
    b.textContent=ok?'✓ Copied':'Copy failed';
    setTimeout(()=>b.textContent='📋 Copy caption + hashtags',1800)});
  document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{const n=b.dataset.publish, plats=b.dataset.plats.split(',');
    const names=plats.map(k=>({youtube:'YouTube',instagram:'Instagram @anotherparty25'})[k]).join(' and ');
    if(!confirm(`Post "${n}" to ${names} now?\n\nClaude will upload it in your Chrome with this caption and cover. This goes public.`))return;
    b.disabled=true; const r=await post(`/api/p/${cur}/publish`,{video:n,platforms:plats}); if(r.error)alert(r.error); refresh(true)});
  document.querySelectorAll('[data-savetags]').forEach(b=>b.onclick=async()=>{const v=b.closest('.postp').querySelector('[data-pf=tags]').value;
    await fetch('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:'@anotherparty25',hashtags:v})});
    ACC['@anotherparty25']={hashtags:v};b.textContent='✓ Saved'});
}
const WIDE=new Set(); try{JSON.parse(localStorage.getItem('reelstudio.wide')||'[]').forEach(x=>WIDE.add(x))}catch(e){}
const isWide=o=>WIDE.has(o.name)||(!WIDE.has('!'+o.name)&&(data.outputs||[]).length===1);
function timelines(){
  document.querySelectorAll('[data-wide]').forEach(b=>b.onclick=()=>{const n=b.dataset.wide, o={name:n};
    if(isWide(o)){WIDE.delete(n);WIDE.add('!'+n)}else{WIDE.delete('!'+n);WIDE.add(n)}
    try{localStorage.setItem('reelstudio.wide',JSON.stringify([...WIDE]))}catch(e){} render()});
  let tip=$('#tltip'); if(!tip){tip=document.createElement('div');tip.id='tltip';tip.className='tltip';document.body.appendChild(tip)}
  document.querySelectorAll('.timeline[data-v]').forEach(tlEl=>{
    const v=tlEl.dataset.v, start=+tlEl.dataset.start, span=+tlEl.dataset.span;
    tlEl.querySelectorAll('.tl:not(.pending)').forEach(b=>b.onpointerdown=e=>{
      e.preventDefault(); editing=true; b.setPointerCapture(e.pointerId); b.classList.add('drag');
      const mode=e.target.classList.contains('l')?'l':e.target.classList.contains('r')?'r':'m';
      const s0=+b.dataset.s, e0=+b.dataset.e, x0=e.clientX, W=tlEl.getBoundingClientRect().width;
      let s=s0, en=e0;
      b.onpointermove=ev=>{
        const d=Math.round((ev.clientX-x0)/W*span*10)/10;
        if(mode==='m'){const len=e0-s0; s=Math.min(Math.max(start,s0+d),start+span-len); en=s+len}
        if(mode==='l') s=Math.min(Math.max(start,s0+d),en-0.5);
        if(mode==='r') en=Math.max(Math.min(start+span,e0+d),s+0.5);
        b.style.left=(s-start)/span*100+'%'; b.style.width=(en-s)/span*100+'%';
        tip.style.display='block'; tip.style.left=ev.clientX+12+'px'; tip.style.top=ev.clientY-30+'px';
        tip.textContent=`${fmt(s-start)} → ${fmt(en-start)}  (${(en-s).toFixed(1)}s)`};
      b.onpointerup=async()=>{b.onpointermove=b.onpointerup=null; b.classList.remove('drag'); tip.style.display='none'; editing=false;
        if(Math.abs(s-s0)>0.05||Math.abs(en-e0)>0.05){await post(`/api/p/${cur}/move`,{video:v,id:b.dataset.id,s,e:en});refresh(true)}
        else{const vid=document.querySelector(`video[data-v="${v}"]`), cuts=tlEl.dataset.cuts;   // a click: jump the video there
          if(vid&&cuts){vid.currentTime=Math.max(0,src2out(s0,cuts)-0.3);vid.play()}}};
    });
  });
  document.querySelectorAll('.timeline[data-v]').forEach(tlEl=>{
    const vid=document.querySelector(`video[data-v="${tlEl.dataset.v}"]`), ph=tlEl.querySelector('.phl'), cuts=tlEl.dataset.cuts;
    if(!vid||!ph||!cuts)return;
    const start=+tlEl.dataset.start, span=+tlEl.dataset.span, wrap=tlEl.parentElement;
    vid.ontimeupdate=()=>{const s=out2src(vid.currentTime,cuts); if(s==null){ph.style.display='none';return}
      ph.style.display='block'; ph.style.left=(s-start)/span*100+'%';
      const x=(s-start)/span*tlEl.offsetWidth; if(!vid.paused&&(x<wrap.scrollLeft||x>wrap.scrollLeft+wrap.clientWidth-20)) wrap.scrollLeft=x-40};
    vid.onplay=()=>{LASTVID=vid};
  });
  (LIB?Promise.resolve(LIB):api('/api/library')).then(l=>{LIB=l||[];
    document.querySelectorAll('.tltray').forEach(tr=>{tr.innerHTML=trayHTML();
      tr.querySelectorAll('.th').forEach(th=>{th.ondragstart=e=>{editing=true;e.dataTransfer.setData('text/rs-path',th.dataset.path)};
        th.ondragend=()=>{editing=false}})})});
  document.querySelectorAll('.timeline[data-v]').forEach(tlEl=>{
    const start=+tlEl.dataset.start, span=+tlEl.dataset.span;
    const at=e=>{const r=tlEl.getBoundingClientRect(), s=start+Math.min(Math.max(0,(e.clientX-r.left)/r.width),1)*span;
      return {start:Math.round(s*10)/10, end:Math.round(Math.min(s+3.8,start+span)*10)/10}};
    tlEl.ondragenter=()=>editing=true;
    tlEl.ondragover=e=>{e.preventDefault();tlEl.classList.add('over');const a=at(e);
      tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY-30+'px';tip.textContent=`B-roll at ${fmt(a.start-start)}`};
    tlEl.ondragleave=()=>{tlEl.classList.remove('over');tip.style.display='none'};
    tlEl.ondrop=async e=>{e.preventDefault();tlEl.classList.remove('over');tip.style.display='none';
      await dropBroll(e,at(e),m=>tip.textContent=m)};
  });
  document.querySelectorAll('[data-reset]').forEach(a=>a.onclick=async()=>{await post(`/api/p/${cur}/move_reset`,{video:a.dataset.reset});refresh(true)});
}
let LINES={id:null,rows:[]}, LIB=null, linesTop=0;
const thumb=(f,url,mine)=>`<div class="th ${mine?'mine':''}" draggable="true" data-path="${esc(f.path)}" title="${esc(f.name)}${mine?' (this project)':' (library)'}"
      style="${f.video?'':`background-image:url('${url}')`}"><span>${f.video?'🎬 ':''}${esc(f.name)}</span></div>`;
const trayHTML=()=>((data&&data.pool)||[]).length||(LIB&&LIB.length)?
    ((data&&data.pool)||[]).map(f=>thumb(f,`/files/${cur}/${f.path.split('/').map(encodeURIComponent).join('/')}`,true)).join('')+
    (LIB||[]).map(f=>thumb(f,`/lib/${encodeURIComponent(f.name)}`,false)).join('')
    :'<span class="muted" style="font-size:13px">Your library is empty. Put photos/clips in Projects/Reels/_library, or drag files from Finder.</span>';
// a B-roll drop (library thumb or Finder file) -> hand-placed B-roll at that transcript time
async function dropBroll(e,at,busy){
  let path=e.dataTransfer.getData('text/rs-path');
  if(!path&&e.dataTransfer.files.length){const f=e.dataTransfer.files[0]; if(busy)busy(`Uploading ${f.name}…`);
    const r=await fetch(`/api/p/${cur}/upload?name=${encodeURIComponent(f.name)}&kind=broll`,{method:'PUT',body:f}).then(r=>r.json());path=r.path}
  editing=false;
  if(path){await post(`/api/p/${cur}/broll_add`,{path,...at});refresh(true)}
}
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
async function tight(){
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{if(b.classList.contains('on'))return;
    await post(`/api/p/${cur}/settings`,{edit:b.dataset.edit});refresh(true)});
  if(!$('.tight'))return; const r=await api(`/api/p/${cur}/tightness`)||{};
  document.querySelectorAll('[data-cut]').forEach(i=>{const v=r[i.dataset.cut];
    i.textContent=v==null?(Object.keys(r).length?'I count the ums on the next render':''):`cuts ${Math.round(v)}s`})}
async function byHand(c){
  if(!c.video||!$('#lines'))return;
  if(LINES.id!==cur){const r=await api(`/api/p/${cur}/lines`);LINES={id:cur,rows:Array.isArray(r)?r:[]}}
  if(!LIB) LIB=await api('/api/library');
  $('#tray').innerHTML=trayHTML();
  const mb=c.manual_broll||[];
  const el=$('#lines');
  el.innerHTML=LINES.rows.length?LINES.rows.map(r=>`<div class="ln" data-s="${r.start}" data-e="${r.end}"><span class="tm">${mmss(r.start)}</span><span class="tx">${esc(r.text)}</span>
      ${mb.map((m,i)=>m.start>=r.start&&m.start<=r.end?`<span class="hb">${esc(m.path.split('/').pop())}<b data-del="${i}" title="Remove">✕</b></span>`:'').join('')}</div>`).join('')
    :'<span class="muted">The transcript shows up once the video has been listened to.</span>';
  el.scrollTop=linesTop; el.onscroll=()=>linesTop=el.scrollTop;
  document.querySelectorAll('.tray .th').forEach(th=>{
    th.ondragstart=e=>{editing=true;e.dataTransfer.setData('text/rs-path',th.dataset.path)};
    th.ondragend=()=>{editing=false}});
  el.querySelectorAll('.ln').forEach(ln=>{
    ln.ondragenter=()=>editing=true;
    ln.ondragover=e=>{e.preventDefault();ln.classList.add('over')};
    ln.ondragleave=()=>ln.classList.remove('over');
    ln.ondrop=async e=>{e.preventDefault();e.stopPropagation();ln.classList.remove('over');
      await dropBroll(e,{start:+ln.dataset.s,end:+ln.dataset.e},m=>ln.querySelector('.tx').textContent=m)}});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await post(`/api/p/${cur}/broll_del`,{i:+b.dataset.del});refresh(true)});
}
async function upload(files){
  const drop=$('#drop');
  for(const f of files){
    const k=f.type.startsWith('video')?'video':'shot';     // the server turns a 2nd video into project B-roll
    drop.querySelector('b').textContent=`Uploading ${f.name}…`;
    await fetch(`/api/p/${cur}/upload?name=${encodeURIComponent(f.name)}&kind=${k}`,{method:'PUT',body:f});
  }
  refresh(true);
}
// ---------- pages: inspiration board, B-roll library, health check ----------
let VIEW='project';
function showView(v){VIEW=v;clearTimeout(timer);
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v!=='project') document.querySelectorAll('.proj').forEach(b=>b.classList.remove('on'));
  ({inspiration:inspView,library:libView,health:healthView}[v]||(()=>{}))()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
const putFile=(url,f)=>fetch(url+(url.includes('?')?'&':'?')+'name='+encodeURIComponent(f.name),{method:'PUT',body:f}).then(r=>r.json());
const PRESETS=fetch('/api/presets').then(r=>r.json());

async function inspView(){
  const [{items,likes},ps]=await Promise.all([api('/api/inspiration'),PRESETS]); $('#nInsp').textContent=items.length||'';
  const media=it=>it.file?(it.video?`<video src="/insp/${encodeURIComponent(it.file)}" muted loop playsinline preload="metadata" onmouseenter="this.play()" onmouseleave="this.pause()"></video>`:'')
    :it.yt?'':`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)} ↗</a>`;
  const bg=it=>it.file&&!it.video?`background-image:url('/insp/${encodeURIComponent(it.file)}')`:it.yt?`background-image:url('https://img.youtube.com/vi/${it.yt}/hqdefault.jpg')`:'';
  $('#main').innerHTML=`<div class="top"><h1>Inspiration</h1><span class="spacer"></span></div>
    <p class="muted">Reels, screenshots, YouTube links: anything with a look you want. Say what you like about it and pick a project type, and it becomes part of that type's rules. Claude reads those before every project.</p>
    <div class="drop" id="idrop"><b>Drop screenshots or clips here</b>
      <div class="addrow"><input class="in" id="iurl" placeholder="…or paste a YouTube / Instagram / TikTok link"><button class="btn dark" id="iadd">Add link</button></div></div>
    <div class="board">${items.map(it=>`<div class="ins" data-id="${it.id}">
      <div class="media" style="${bg(it)}">${media(it)}${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener" style="position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:7px;font-size:12px;text-decoration:none">Open ↗</a>`:''}
        <button class="x" data-idel="${it.id}" title="Remove">✕</button></div>
      <div class="body">
        <div class="${(it.likes||[]).length||it.note?'':'ask'}"><b style="font-size:12.5px">${(it.likes||[]).length||it.note?'What you like':'What is it you like about this?'}</b>
          <div class="likes" style="margin-top:6px">${likes.map(l=>`<label><input type="checkbox" data-like="${esc(l)}" ${(it.likes||[]).includes(l)?'checked':''}><span>${esc(l)}</span></label>`).join('')}</div></div>
        <textarea rows="2" data-inote placeholder="In your words… (e.g. the captions pop on the beat)">${esc(it.note||'')}</textarea>
        <select data-ipre><option value="">Use for… (pick a project type)</option>${ps.map(p=>`<option value="${p.id}" ${it.preset===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        <small class="muted">Added ${esc(it.added)}${it.preset&&((it.likes||[]).length||it.note)?' · ✓ in the '+esc((ps.find(p=>p.id===it.preset)||{}).name||it.preset)+' rules':''}</small>
      </div></div>`).join('')||''}</div>`;
  const d=$('#idrop'); d.ondragover=e=>{e.preventDefault();d.classList.add('over')}; d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=async e=>{e.preventDefault();d.classList.remove('over');
    const url=e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain');
    if(e.dataTransfer.files.length){d.querySelector('b').textContent='Adding…';for(const f of e.dataTransfer.files) await putFile('/api/inspiration',f)}
    else if(url) await post('/api/inspiration',{url});
    inspView()};
  $('#iadd').onclick=async()=>{const u=$('#iurl').value.trim(); if(!u)return; await post('/api/inspiration',{url:u}); inspView()};
  document.querySelectorAll('.ins').forEach(card=>{const id=card.dataset.id;
    const save=async()=>{await post('/api/inspiration',{id,likes:[...card.querySelectorAll('[data-like]:checked')].map(x=>x.dataset.like),
      note:card.querySelector('[data-inote]').value,preset:card.querySelector('[data-ipre]').value})};
    card.querySelectorAll('[data-like]').forEach(x=>x.onchange=save);
    card.querySelector('[data-inote]').onblur=save;
    card.querySelector('[data-ipre]').onchange=async()=>{await save();inspView()}});
  document.querySelectorAll('[data-idel]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this from the board?'))return;
    await post('/api/inspiration',{id:b.dataset.idel,delete:true});inspView()});
}

async function libView(){
  const files=await api('/api/library'); LIB=files; $('#nLib').textContent=files.length||'';
  $('#main').innerHTML=`<div class="top"><h1>B-roll library</h1></div>
    <p class="muted">Your own photos and clips. A file plays as B-roll when you say its name (or any 4+ letter word in it), ahead of stock footage. Rename a file to change its trigger words. Clips go picture-in-picture, photos slowly zoom or pan.</p>
    <div class="drop" id="ldrop"><b>Drop photos or clips here</b> to add them to your library.</div>
    <div class="libgrid">${files.map(f=>`<div class="lf">
      <div class="m" style="${f.video?'':`background-image:url('/lib/${encodeURIComponent(f.name)}')`}">${f.video?'🎬':''}</div>
      <input value="${esc(f.name.replace(/\.[^.]+$/,''))}" data-ren="${esc(f.name)}" title="Trigger words: rename to change them">
      <div class="row"><span>${f.video?'Clip → PiP':'Photo → Ken Burns'}</span><a data-ldel="${esc(f.name)}">Remove</a></div></div>`).join('')}</div>`;
  const d=$('#ldrop'); d.ondragover=e=>{e.preventDefault();d.classList.add('over')}; d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=async e=>{e.preventDefault();d.classList.remove('over');d.querySelector('b').textContent='Adding…';
    for(const f of e.dataTransfer.files) await putFile('/api/library',f); libView()};
  document.querySelectorAll('[data-ren]').forEach(el=>el.onchange=async()=>{const r=await post('/api/library',{name:el.dataset.ren,rename:el.value});
    if(r.error)alert(r.error); libView()});
  document.querySelectorAll('[data-ldel]').forEach(a=>a.onclick=async()=>{if(!confirm('Remove '+a.dataset.ldel+' from the library?'))return;
    await post('/api/library',{name:a.dataset.ldel,delete:true}); libView()});
}

async function healthView(){
  const h=await api('/api/health'), bad=h.checks.filter(c=>!c.ok).length; $('#nHealth').textContent=bad?bad+' ⚠️':'✓';
  const gb=b=>(b/1e9).toFixed(1)+' GB';
  $('#main').innerHTML=`<div class="top"><h1>Health check</h1><span class="pill ${bad?'err':'done'}"><span class="dot"></span>${bad?bad+' need attention':'Everything working'}</span></div>
    <div class="card" style="margin-top:16px">${h.checks.map(c=>`<div class="hc"><span class="ic">${c.ok?'✅':'⚠️'}</span><div style="flex:1"><b>${esc(c.name)}</b><small>${esc(c.detail)}${c.fix?' · '+esc(c.fix):''}</small></div>${c.test?`<button class="btn small" data-test="${c.test}">Test</button>`:''}</div>`).join('')}
      <div class="hc"><span class="ic">💾</span><div style="flex:1"><b>Storage</b><small>${h.projects} projects use ${gb(h.reels_bytes)}. Kept previous versions of re-rendered videos: ${gb(h.prev_bytes)}.</small></div>
        ${h.prev_bytes?`<button class="btn small" id="cleanup">Delete previous versions</button>`:''}</div></div>`;
  document.querySelectorAll('[data-test]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Testing…';await post('/api/claude_test');healthView()});
  $('#cleanup')&&($('#cleanup').onclick=async()=>{if(!confirm('Delete all kept previous versions? Current videos stay.'))return;await post('/api/cleanup');healthView()});
}
api('/api/health').then(h=>{const bad=h.checks.filter(c=>!c.ok).length;$('#nHealth').textContent=bad?bad+' ⚠️':'✓'});
api('/api/inspiration').then(r=>$('#nInsp').textContent=r.items.length||'');
api('/api/library').then(r=>$('#nLib').textContent=r.length||'');

let saved=null; try{saved=localStorage.getItem('reelstudio.cur')}catch(e){}
if(saved) cur=saved;
loadList().then(()=>cur&&open(cur));
